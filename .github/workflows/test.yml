name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.4-noble
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift on macOS
        if: runner.os == 'macOS'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4.3'
      - run: swift --version
      - run: swift test --parallel --num-workers 4
      - run: sh Tests/Integration/source-update-smoke.sh
      - name: Declare artifact build identity
        run: |
          swift -e '
          import Foundation
          let input = URL(fileURLWithPath: "Sources/bsa/agent.json")
          var product = try JSONSerialization.jsonObject(with: Data(contentsOf: input)) as! [String: Any]
          product["build"] = String(ProcessInfo.processInfo.environment["GITHUB_SHA"]!.prefix(7))
          var data = try JSONSerialization.data(withJSONObject: product, options: [.prettyPrinted, .sortedKeys])
          data.append(0x0A)
          try data.write(to: input, options: .atomic)
          '
      - run: ./install.sh /tmp/bsa-bin
      - run: sh Tests/Integration/cli-smoke.sh /tmp/bsa-bin/bsa
      - name: Package tested CLI
        run: |
          mkdir -p dist/bsa
          cp /tmp/bsa-bin/bsa README.md LICENSE dist/bsa/
          tar -czf "dist/bsa-$(uname -s)-$(uname -m).tar.gz" -C dist bsa
      - uses: actions/upload-artifact@v4
        with:
          name: bsa-${{ matrix.os }}
          path: dist/*.tar.gz
