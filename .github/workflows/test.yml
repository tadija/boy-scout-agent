name: Swift
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: swift test
      - run: swift build -c release
      - run: .build/release/bsa --help
      - run: sh Tests/Integration/cli-smoke.sh "$PWD/.build/release/bsa"
