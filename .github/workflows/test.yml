name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.0-noble
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --parallel --num-workers 4
      - run: sh Tests/Integration/embedding-smoke.sh
      - run: sh Tests/Integration/version-smoke.sh
      - run: ./Scripts/install.sh /tmp/bsa-bin
      - run: sh Tests/Integration/cli-smoke.sh /tmp/bsa-bin/bsa
      - name: Package tested CLI
        run: |
          mkdir -p dist/bsa
          cp /tmp/bsa-bin/bsa README.md LICENSE dist/bsa/
          tar -czf "dist/bsa-$(uname -s)-$(uname -m).tar.gz" -C dist bsa
      - uses: actions/upload-artifact@v4
        with:
          name: bsa-${{ matrix.os }}
          path: dist/*.tar.gz
