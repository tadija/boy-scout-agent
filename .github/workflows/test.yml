name: Swift
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.0-noble
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Core tests
        run: swift test
      - name: External integration tests
        run: BSA_INTEGRATION_TESTS=1 swift test --filter ExternalIntegrationTests
      - run: swift build -c release
      - run: sh Tests/Integration/cli-smoke.sh "$(swift build -c release --show-bin-path)/bsa"
      - name: Package tested CLI
        run: |
          mkdir -p dist/bsa
          cp "$(swift build -c release --show-bin-path)/bsa" README.md dist/bsa/
          tar -czf "dist/bsa-$(uname -s)-$(uname -m).tar.gz" -C dist bsa
      - uses: actions/upload-artifact@v4
        with:
          name: bsa-${{ matrix.os }}
          path: dist/*.tar.gz
